services:
  test-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tests:
    build: .
    depends_on:
      test-db:
        condition: service_healthy
    env_file:
      - src/.env.test
    working_dir: /code
    volumes:
      - ./src:/code/src
      - ./tests:/code/tests
      - ./pytest.ini:/code/pytest.ini
      - ./src/alembic.ini:/code/src/alembic.ini
      - ./src/migrations:/code/src/migrations
    entrypoint: [ "sh", "-c", "cd src && alembic upgrade head && cd .. && pytest tests/ -v" ]


# Recommended workflow for running tests:
# `docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --remove-orphans tests`
# First run, or after changing dependencies/Dockerfile `docker compose -f docker-compose.test.yml up --build tests`

# Normal repeated test runs: `docker compose -f docker-compose.test.yml up tests`
# Stop and remove test containers: `docker compose -f docker-compose.test.yml down`
# Stop and remove containers plus database volume: `docker compose -f docker-compose.test.yml down --volumes`

# --abort-on-container-exit : Stops all Compose services when one container exits.
# For tests, this is useful because the tests service exits after pytest finishes.
#  Then Docker Compose stops the database container too.

# run specific test file: `docker compose -f docker-compose.test.yml run --rm --remove-orphans tests sh -c "cd src && alembic upgrade head && cd .. && pytest tests/unit_tests/model_tests/test_service_category.py -v"`