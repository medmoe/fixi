services:
  test-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-minio:
    # quay.io/minio/minio and Docker Hub's minio/minio were both pulled
    # from public distribution by MinIO in Sept 2026 (year-long retreat
    # from open source, pushing users to their commercial AIStor product --
    # dl.min.io's binaries return 410 Gone too now). Chainguard mirrors the
    # same upstream MinIO server binary and is still pullable anonymously.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      # No curl/wget/grep in this minimal image (see the image comment
      # above) -- bash's /dev/tcp is the only network primitive available,
      # and bash string matching stands in for grep.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && response=$$(head -1 <&3) && [[ \"$$response\" == *200* ]]" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-minio-setup:
    # quay.io/minio/mc is gone the same way as minio/minio above, and
    # Chainguard's free tier doesn't mirror the mc client. aws-cli talks to
    # MinIO fine since MinIO's API is S3-compatible -- same job, different
    # client. The bucket policy (public download, no public listing) mirrors
    # `mc anonymous set download` exactly; see docker/minio-download-policy.json.
    image: amazon/aws-cli:latest
    depends_on:
      test-minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/minio-download-policy.json:/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://test-minio:9000 s3 mb s3://uploads || true &&
      aws --endpoint-url=http://test-minio:9000 s3api put-bucket-policy --bucket uploads --policy file:///policy.json || true
      "
    restart: "no"

  test-redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  tests:
    build: .
    depends_on:
      test-db:
        condition: service_healthy
      test-minio:
        condition: service_healthy
      test-minio-setup:
        condition: service_completed_successfully
      test-redis:
        condition: service_healthy
    env_file:
      - src/.env.test
    working_dir: /app
    environment:
      - PATH=/app/.venv/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./src/alembic.ini:/app/src/alembic.ini
      - ./src/migrations:/app/src/migrations

    entrypoint: [ "sh", "-c", "exec \"$@\"", "--" ] # exec replaces the current shell process with the command that follows it.
    command: [ "pytest", "tests/", "-v" ]


# Recommended workflow for running tests:
# `docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --remove-orphans tests`
# First run, or after changing dependencies/Dockerfile `docker compose -f docker-compose.test.yml up --build tests`

# Normal repeated test runs: `docker compose -f docker-compose.test.yml up tests`
# Stop and remove test containers: `docker compose -f docker-compose.test.yml down`
# Stop and remove containers plus database volume: `docker compose -f docker-compose.test.yml down --volumes`

# --abort-on-container-exit : Stops all Compose services when one container exits.
# For tests, this is useful because the tests service exits after pytest finishes.
#  Then Docker Compose stops the database container too.

# run specific test file: docker compose -f docker-compose.test.yml run tests pytest tests/unit_tests/model_tests --no-cov