services:
  test-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-minio-setup:
    image: minio/mc:latest
    depends_on:
      test-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://test-minio:9000 minioadmin minioadmin && 
      mc mb -p local/uploads || true && 
      mc anonymous set download local/uploads || true
      "
    restart: "no"

  tests:
    build: .
    depends_on:
      test-db:
        condition: service_healthy
      test-minio:
        condition: service_healthy
      test-minio-setup:
        condition: service_completed_successfully
    env_file:
      - src/.env.test
    working_dir: /code
    volumes:
      - ./src:/code/src
      - ./tests:/code/tests
      - ./pytest.ini:/code/pytest.ini
      - ./src/alembic.ini:/code/src/alembic.ini
      - ./src/migrations:/code/src/migrations

    entrypoint: [ "sh", "-c", "exec \"$@\"", "--" ] # exec replaces the current shell process with the command that follows it.
    command: [ "pytest", "tests/", "-v" ]


# Recommended workflow for running tests:
# `docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --remove-orphans tests`
# First run, or after changing dependencies/Dockerfile `docker compose -f docker-compose.test.yml up --build tests`

# Normal repeated test runs: `docker compose -f docker-compose.test.yml up tests`
# Stop and remove test containers: `docker compose -f docker-compose.test.yml down`
# Stop and remove containers plus database volume: `docker compose -f docker-compose.test.yml down --volumes`

# --abort-on-container-exit : Stops all Compose services when one container exits.
# For tests, this is useful because the tests service exits after pytest finishes.
#  Then Docker Compose stops the database container too.

# run specific test file: docker compose -f docker-compose.test.yml run tests pytest tests/unit_tests/model_tests --no-cov