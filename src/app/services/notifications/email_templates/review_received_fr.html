<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvel avis reçu</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="background-color:#111827;padding:20px 24px;">
<span style="color:#ffffff;font-size:18px;font-weight:bold;">Fixi</span>
</td></tr>
<tr><td style="padding:24px;">
<h1 style="margin:0 0 12px;font-size:20px;color:#111827;">Vous avez reçu un nouvel avis</h1>
<p style="margin:0 0 16px;font-size:14px;color:#374151;line-height:1.5;">
Bonjour $recipient_name,
</p>
<p style="margin:0 0 16px;font-size:14px;color:#374151;line-height:1.5;">
$reviewer_name vous a laissé un avis $rating/5 pour la mission « $job_title ».
</p>
<p style="margin:0 0 16px;padding:12px 16px;background-color:#f9fafb;border-left:3px solid #111827;font-size:14px;color:#374151;font-style:italic;">
$comment
</p>
<p style="margin:24px 0 0;">
<a href="$app_url" style="display:inline-block;background-color:#111827;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;font-size:14px;">Voir l'avis</a>
</p>
</td></tr>
<tr><td style="padding:16px 24px;background-color:#f9fafb;">
<p style="margin:0;font-size:12px;color:#9ca3af;">Fixi — vous recevez cet email suite à une action sur votre compte.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
