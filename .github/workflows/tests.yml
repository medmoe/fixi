name: Tests

on: [ push, pull_request ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio:latest
        # No 'command:' here (not supported by Actions services)
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # This tells MinIO to start the server using /data without args
          MINIO_VOLUMES: /data
          # Optional: expose console on 9001; server listens on 9000 by default
          MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
        ports:
          - 9000:9000   # S3 API
          - 9001:9001   # Console (optional)
        # You can still pass docker run options if you want (not required)
        # options: >-
        #   --restart=always

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Wait for MinIO to be ready
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:9000/minio/health/ready >/dev/null; then
              echo "✅ MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO... ($i/60)"
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Create uploads bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local="http://minioadmin:minioadmin@localhost:9000" \
            minio/mc:latest \
            sh -c 'mc mb -p local/uploads || true && mc ls local'

      - name: Run tests (uv)
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only
          APP_S3_ENDPOINT: http://localhost:9000   # <-- include scheme
          APP_S3_ACCESS_KEY: minioadmin
          APP_S3_SECRET_KEY: minioadmin
          APP_S3_BUCKET_UPLOADS: uploads
        run: uv run pytest
