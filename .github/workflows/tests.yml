name: Tests
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      minio:
        # Option A (recommended): CI-friendly MinIO image
        image: minio/minio:edge-cicd
        # Option B: your own wrapper image that runs `server /data` as CMD
        # image: ghcr.io/your-org/minio-ci:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval=5s --health-timeout=3s --health-retries=120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create venv
        run: uv venv

      - name: Install package with dev dependencies
        run: uv pip install -e ".[dev]"

      # extra safety wait (service healthcheck should already gate this)
      - name: Wait for MinIO readiness
        run: |
          for i in {1..120}; do
            if curl -sf http://localhost:9000/minio/health/ready >/dev/null; then
              echo "✅ MinIO is ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      - name: Create uploads bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local="http://minioadmin:minioadmin@localhost:9000" \
            minio/mc:latest \
            sh -c 'mc mb -p local/uploads || true && mc ls local'

      - name: Run tests (uv)
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-testing-only
          # IMPORTANT: full URL (scheme included) for botocore
          APP_S3_ENDPOINT: http://localhost:9000
          APP_S3_ACCESS_KEY: minioadmin
          APP_S3_SECRET_KEY: minioadmin
          APP_S3_BUCKET_UPLOADS: uploads
        run: uv run pytest
